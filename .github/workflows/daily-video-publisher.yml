name: Daily Video & Carousel Publisher (YouTube, TikTok, Instagram)

permissions:
  contents: write

on:
  schedule:
    # Fixed to 18:00 UTC, which is 10:00 AM PST.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD), leave blank for latest'
        required: false
        default: ''
      platform:
        description: 'Publish target'
        required: false
        type: choice
        default: all
        options:
          - all
          - instagram
          - tiktok
          - youtube

jobs:
  render_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restore YouTube Token from Secret
        if: env.YOUTUBE_TOKEN_JSON != ''
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$YOUTUBE_TOKEN_JSON" > scripts/youtube_token.json

      - name: Render Media and Publish
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_WEBHOOK_URL: ${{ secrets.TIKTOK_WEBHOOK_URL }}
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          INSTAGRAM_WEBHOOK_URL: ${{ secrets.INSTAGRAM_WEBHOOK_URL }}
        run: |
          TARGET_FLAG=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_FLAG="--date ${{ github.event.inputs.target_date }}"
          fi
          
          PLATFORM="${{ github.event.inputs.platform }}"
          if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "youtube" ]; then
            FLAGS="--youtube"
          else
            FLAGS=""
          fi
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "tiktok" ]; then
            PLATFORM_TIKTOK=true
          else
            PLATFORM_TIKTOK=false
          fi
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "instagram" ]; then
            PLATFORM_INSTAGRAM=true
          else
            PLATFORM_INSTAGRAM=false
          fi
          if [ "$PLATFORM_TIKTOK" = "true" ] && { [ -n "$BUFFER_API_KEY" ] || [ -n "$TIKTOK_ACCESS_TOKEN" ] || [ -n "$TIKTOK_WEBHOOK_URL" ] || [ -n "$SOCIAL_WEBHOOK_URL" ]; }; then
            FLAGS="$FLAGS --tiktok"
          fi
          if [ "$PLATFORM_INSTAGRAM" = "true" ] && { [ -n "$BUFFER_API_KEY" ] || [ -n "$INSTAGRAM_WEBHOOK_URL" ] || [ -n "$SOCIAL_WEBHOOK_URL" ]; }; then
            FLAGS="$FLAGS --instagram"
          fi
          
          python scripts/daily_pipeline.py $TARGET_FLAG $FLAGS

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-video
          path: dist/shorts/*.mp4
          retention-days: 7

      - name: Upload Carousel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-photo-carousel
          path: dist/carousels/
          retention-days: 7

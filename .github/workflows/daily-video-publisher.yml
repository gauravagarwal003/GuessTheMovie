name: Daily Video Publisher (Shorts & TikTok)

on:
  schedule:
    # Runs at 05:15 UTC every day (9:15 PM PST / 12:15 AM EST), 15 mins after the movie sync worker runs
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD), leave blank for latest'
        required: false
        default: ''

jobs:
  render_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restore YouTube Token from Secret
        if: env.YOUTUBE_TOKEN_JSON != ''
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$YOUTUBE_TOKEN_JSON" > scripts/youtube_token.json

      - name: Render and Publish
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_WEBHOOK_URL: ${{ secrets.TIKTOK_WEBHOOK_URL }}
        run: |
          TARGET_FLAG=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_FLAG="--date ${{ github.event.inputs.target_date }}"
          fi
          
          # If YouTube token exists, publish to YouTube. If TikTok webhook exists, publish to TikTok.
          FLAGS="--youtube"
          if [ -n "$TIKTOK_ACCESS_TOKEN" ] || [ -n "$TIKTOK_WEBHOOK_URL" ]; then
            FLAGS="$FLAGS --tiktok"
          fi
          
          python scripts/daily_pipeline.py $TARGET_FLAG $FLAGS

      - name: Upload Video as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-video
          path: dist/shorts/*.mp4
          retention-days: 7
